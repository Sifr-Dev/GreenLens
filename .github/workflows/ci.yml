name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust build, tests, and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The build prerequisites documented in README.md "Building and running".
      # Without these, eframe's wayland/x11/glow features fail to compile.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build all targets
        run: cargo build --locked --all-targets

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # 5 unit tests cover the worker wire protocol and lifecycle directly.
      - name: Unit tests
        run: cargo test --locked --lib

      # The integration tests spawn the real python worker, which needs the
      # TensorFlow virtualenv (about 1.5 GB), a built model artifact, and a
      # dataset. This runner has none of them, so the tests return early and
      # still report "ok". That silent skip would make a green run mean
      # nothing, so require the run to state exactly what it exercised.
      - name: Verify worker integration tests ran or skipped explicitly
        run: |
          output=$(cargo test --locked --test worker_integration -- --nocapture 2>&1)
          echo "$output"
          ran_worker=no
          echo "$output" | grep -q "model loaded" && ran_worker=yes
          skipped=""
          echo "$output" | grep -q "skipping worker integration test" && skipped="$skipped worker"
          echo "$output" | grep -q "dataset not present" && skipped="$skipped dataset"
          if [ "$ran_worker" = yes ]; then
            echo "::notice::Worker integration tests started the real worker."
            [ -n "$skipped" ] && echo "::notice::Skipped checks:$skipped"
            exit 0
          fi
          if echo "$skipped" | grep -q worker; then
            echo "::notice::Worker integration tests skipped explicitly (no .venv or model artifact); the unit-test step still gates this build."
            exit 0
          fi
          echo "::error::worker_integration reported success but neither ran the worker nor reported a skip."
          exit 1

  ml:
    name: ML data preparation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the dependencies ml/tests/test_prepare.py imports. TensorFlow is
      # deliberately not installed: preparation is pure PIL/numpy, and the
      # worker tests need a dataset and model artifact that CI does not have.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          grep -E '^(pillow|numpy)==' ml/requirements.txt > /tmp/ml-test-reqs.txt
          grep -E '^pytest==' ml/requirements-dev.txt >> /tmp/ml-test-reqs.txt
          cat /tmp/ml-test-reqs.txt
          python -m pip install -r /tmp/ml-test-reqs.txt

      - name: Run data preparation tests
        working-directory: ml
        run: python -m pytest tests/test_prepare.py -v
